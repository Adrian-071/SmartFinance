<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Finova Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#6366f1;
    --accent2:#8b5cf6;
    --text:#e2e8f0;
}

body{
    margin:0;
    font-family:'Segoe UI';
    background:var(--bg);
    color:var(--text);
}

.sidebar{
    width:240px;
    height:100vh;
    position:fixed;
    background:linear-gradient(180deg,#1e3a8a,#6d28d9);
    padding:20px;
}

.sidebar h1{
    text-align:center;
    font-size:28px;
}

.sidebar button{
    width:100%;
    margin:10px 0;
    padding:12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    color:white;
    cursor:pointer;
}

.main{
    margin-left:260px;
    padding:30px;
}

.card{
    background:var(--card);
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #334155;
    background:#020617;
    color:white;
}

button.action{
    background:linear-gradient(45deg,var(--accent),var(--accent2));
    padding:12px;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.metric{
    background:#020617;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

#decisionBox{
    margin-top:20px;
    padding:20px;
    border-radius:12px;
    font-weight:bold;
}

.excelente{background:rgba(34,197,94,0.2);color:#22c55e;}
.aceptable{background:rgba(251,191,36,0.2);color:#facc15;}
.riesgo{background:rgba(239,68,68,0.2);color:#ef4444;}

.historial-item{
    background:#020617;
    padding:10px;
    border-radius:8px;
    margin:5px 0;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="sidebar">
<h1>🚀 Finova</h1>

<button onclick="mostrar('inicio')">Inicio</button>
<button onclick="mostrar('simulador')">Simulador</button>
<button onclick="mostrar('historial')">Historial</button>
<button onclick="mostrar('educacion')">Educación</button>
<button onclick="logout()">Salir</button>
</div>

<div class="main">

<div id="inicio" class="card">
<h1>Bienvenido a Finova</h1>
<p>Analiza inversiones como un profesional</p>
</div>

<div id="simulador" class="card hidden">

<h2>Simulador</h2>

<input id="inversion" placeholder="Inversión (-10000)">
<input id="tasa" placeholder="Tasa (0.1)">

<div id="flujos-container">
<input class="flujo" placeholder="Año 1">
</div>

<button class="action" onclick="agregarFlujo()">➕ Año</button>
<button class="action" onclick="calcular()">Calcular</button>

<div id="resultados" class="hidden">

<h2>Resultados</h2>

<div class="grid">
<div class="metric"><h3>VPN</h3><p id="vpn"></p></div>
<div class="metric"><h3>TIR</h3><p id="tir"></p></div>
</div>

<canvas id="grafica"></canvas>

<div id="decisionBox"><p id="ia"></p></div>

<button class="action" onclick="descargarPDF()">Descargar PDF</button>

</div>

</div>

<div id="historial" class="card hidden">
<h2>Historial</h2>
<div id="lista"></div>
</div>

<div id="educacion" class="card hidden">
<h2>Conceptos</h2>
<p><b>VPN:</b> Mide si ganas o pierdes dinero.</p>
<p><b>TIR:</b> Rentabilidad del proyecto.</p>
<p><b>Regla:</b> Si VPN > 0 y TIR > tasa → invertir.</p>
</div>

</div>

<script>

function mostrar(id){
["inicio","simulador","historial","educacion"].forEach(x=>{
document.getElementById(x).classList.add("hidden");
});
document.getElementById(id).classList.remove("hidden");

if(id==="historial") cargarHistorial();
}

function agregarFlujo(){
const input=document.createElement("input");
input.classList.add("flujo");
document.getElementById("flujos-container").appendChild(input);
}

async function calcular(){

const inversion=document.getElementById("inversion").value;
const tasa=document.getElementById("tasa").value;
const flujos=[...document.querySelectorAll(".flujo")].map(i=>i.value);

const res=await fetch("/calcular",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({inversion,tasa,flujos})
});

const data=await res.json();

document.getElementById("resultados").classList.remove("hidden");

document.getElementById("vpn").innerText="$"+data.vpn;
document.getElementById("tir").innerText=data.tir+"%";

const box=document.getElementById("decisionBox");
box.classList.remove("excelente","aceptable","riesgo");

if(data.vpn>1000){box.classList.add("excelente");}
else if(data.vpn>0){box.classList.add("aceptable");}
else{box.classList.add("riesgo");}

document.getElementById("ia").innerText=data.analisis;

new Chart(document.getElementById("grafica"),{
type:"line",
data:{
labels:data.tasas,
datasets:[{label:"VPN",data:data.vpns}]
}
});

}

async function cargarHistorial(){
const res=await fetch("/historial");
const data=await res.json();

const lista=document.getElementById("lista");
lista.innerHTML="";

data.reverse().forEach(p=>{
const div=document.createElement("div");
div.classList.add("historial-item");
div.innerHTML=`📅 ${p.fecha} | VPN: $${p.vpn} | TIR: ${p.tir}%`;
lista.appendChild(div);
});
}

async function descargarPDF(){
const { jsPDF } = window.jspdf;
const pdf = new jsPDF();

const canvas = await html2canvas(document.body);
const img = canvas.toDataURL("image/png");

pdf.addImage(img, 'PNG', 0, 0, 210, 297);
pdf.save("finova.pdf");
}

function logout(){
window.location="/logout";
}

</script>

</body>
</html>
